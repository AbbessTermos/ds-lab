apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: dfs-gateway:latest
          imagePullPolicy: Never          # image built locally by docker compose
          env:
            - {name: DATABASE_URL, value: "postgresql://dfs:dfs@postgres/dfs"}
            - {name: API_KEYS, value: "admin-key:100000"}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /ui/, port: 8000}
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  type: NodePort
  selector: {app: gateway}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30080}]
