events {}
http {
  upstream gateways {
    server gateway1:8000 max_fails=2 fail_timeout=5s;
    server gateway2:8000 max_fails=2 fail_timeout=5s;
  }
  server {
    listen 80;
    client_max_body_size 0;          # allow large uploads
    proxy_request_buffering off;     # stream uploads straight to the gateway
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    location / {
      proxy_pass http://gateways;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_set_header Host $host;
    }
  }
}
